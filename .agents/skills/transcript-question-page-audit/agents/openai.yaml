interface:
  display_name: "Transcript Question Page Audit"
  short_description: "Fix searchable Q&A Markdown and validate answers"
  default_prompt: "Use $transcript-question-page-audit to fix an existing Q&A page with full transcript coverage unless narrowly targeted, direct questions, concise short answers, fully developed transcript-grounded expanded answers, and validated timestamps and links; remove routine host attribution, passive reporting, and mechanical framing such as 'Falk says' or 'the criticism is' while preserving supported uncertainty and necessary personal facts."
