interface:
  display_name: "Transcript to MD Reference"
  short_description: "Curate TXT transcripts into searchable four-column Q&A Markdown"
  default_prompt: "Use $transcript-to-md-reference to create a validated four-column Q&A page after full transcript coverage, with all real audience questions, direct short and expanded answers, and no routine host attribution, passive reporting, or mechanical framing such as 'Falk says' or 'the criticism is'; preserve supported uncertainty and necessary personal facts."
